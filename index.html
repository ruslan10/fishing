<script type="module">
import {LEVELS,waveLevel,windLevel} from "./condition-scale.mjs";
import {windowScore} from "./experimental-score.mjs";
function scoreColor(s){return s==null?'var(--fg)':s>=70?'var(--ok-fg)':s>=45?'var(--warn-fg)':'var(--off-fg)';}
const HEB_DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
function nowIL(){ const p = new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Jerusalem',dateStyle:'short',timeStyle:'short'}).format(new Date());
  return { date:p.slice(0,10), hour:+p.slice(11,13) }; }
// Best remaining window, computed at view time: for today, only windows that haven't ended.
function na(v, unit){ return v==null?'<span class="na">חסר</span>':v+(unit||''); }

// Wave range in cm from hourly min/max (honest temporal spread, not an uncertainty band).
// Exact cm (data is 2-decimal meters = 1cm precision), ascending min-max, LTR-isolated.
function waveRangeCm(lo, hi){
  if(lo==null||hi==null) return null;
  const loCm = Math.round(lo*100), hiCm = Math.round(hi*100);
  return loCm===hiCm ? `<bdi class="ltr">${hiCm}</bdi>` : `<bdi class="ltr">${loCm}–${hiCm}</bdi>`;
}
// Sustained-wind range inside a window (km/h), same honest-range approach as waves; gusts stay separate.
function windRangeKmh(w){
  const lo = w.wind_min_kmh ?? w.wind_kmh, hi = w.wind_max_kmh ?? w.wind_kmh;
  if(lo==null||hi==null) return null;
  const a = Math.round(lo), b = Math.round(hi);
  return a===b ? `<bdi class="ltr">${b}</bdi>` : `<bdi class="ltr">${a}–${b}</bdi>`;
}
// Sea state with official IMS Hebrew terms (CodesForIMSWebSite, matching Douglas degrees),
// classified by the displayed rounded cm so label and number always agree.
function seaStateCm(cm){
  if(cm==null) return null;
  const color=LEVELS[waveLevel(cm/100)].color;
  if(cm<10) return ['שקט',color];
  if(cm<50) return ['נוח',color];
  if(cm<125) return ['גלי',color];
  if(cm<250) return ['גבה גלים',color];
  if(cm<400) return ['רוגש',color];
  if(cm<600) return ['סוער',color];
  return ['גועש',color];
}
// Small inline-SVG weather icons (stroke style, tinted for the dark marine palette).
// WMO weather_code from Open-Meteo: 0-1 clear, 2 partly, 3 overcast, 45/48 fog,
// 51-57 drizzle, 61-67 rain, 71-77 snow, 80-82 showers, 85-86 snow showers, 95-99 thunderstorm.
function wxIcon(code, isDay){
  const S = (inner, color) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${inner}</svg>`;
  const sun = '<circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/>';
  const moon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  const cloud = '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>';
  const partlyD = '<circle cx="7" cy="7" r="2.6"/><line x1="7" y1="1.5" x2="7" y2="3"/><line x1="1.5" y1="7" x2="3" y2="7"/><line x1="3.2" y1="3.2" x2="4.3" y2="4.3"/><line x1="10.8" y1="3.2" x2="9.7" y2="4.3"/><path d="M19 13h-1.1A6.5 6.5 0 1 0 8.5 21.5H19a4 4 0 0 0 0-8z"/>';
  const partlyN = '<path d="M12.5 2.5A5.5 5.5 0 1 0 18 8.5 4.3 4.3 0 0 1 12.5 2.5z"/><path d="M19 13h-1.1A6.5 6.5 0 1 0 8.5 21.5H19a4 4 0 0 0 0-8z"/>';
  const drops = '<line x1="8" y1="19" x2="8" y2="21"/><line x1="13" y1="16" x2="13" y2="19"/><line x1="18" y1="19" x2="18" y2="21"/>';
  if(code==null) return '';
  if(code===0||code===1) return isDay===0 ? S(moon,'#cbd5e1') : S(sun,'#fbbf24');
  if(code===2) return isDay===0 ? S(partlyN,'#94a3b8') : S(partlyD,'#fbbf24');
  if(code===3) return S(cloud,'#94a3b8');
  if(code===45||code===48) return S('<line x1="3" y1="10" x2="21" y2="10"/><line x1="5" y1="14" x2="19" y2="14"/><line x1="7" y1="18" x2="17" y2="18"/>','#64748b');
  if(code>=51&&code<=57) return S(cloud+drops,'#67e8f9');
  if((code>=61&&code<=67)||(code>=80&&code<=82)) return S(cloud+drops,'#60a5fa');
  if((code>=71&&code<=77)||code===85||code===86) return S(cloud+'<line x1="8" y1="19" x2="8.01" y2="19"/><line x1="12" y1="21" x2="12.01" y2="21"/><line x1="16" y1="19" x2="16.01" y2="19"/>','#e2e8f0');
  if(code>=95) return S('<path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><polyline points="13 11 9 17 15 17 11 23"/>','#f472b6');
  return S(cloud,'#94a3b8');
}
// Moon phase icon: lit fraction drawn from the calculated illumination (approximation),
// lit side on the right when waxing, on the left when waning (Northern hemisphere view).
function sunIcon(kind){
  const horizon = `<line x1="2" y1="17" x2="22" y2="17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>`;
  const halfSun = (op)=>`<path d="M7 17 a5 5 0 0 1 10 0 Z" fill="currentColor" opacity="${op}"/>`;
  const rays = `<g stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".6"><line x1="12" y1="4" x2="12" y2="6.3"/><line x1="5.8" y1="7.2" x2="7.2" y2="9"/><line x1="18.2" y1="7.2" x2="16.8" y2="9"/></g>`;
  const up = `<g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><line x1="19.5" y1="13.5" x2="19.5" y2="7.5"/><polyline points="17.2,9.8 19.5,7.5 21.8,9.8"/></g>`;
  const down = `<g stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><line x1="19.5" y1="7.5" x2="19.5" y2="13.5"/><polyline points="17.2,11.2 19.5,13.5 21.8,11.2"/></g>`;
  const inner = kind==='dawn' ? halfSun(0.45)+rays+horizon
    : kind==='sunrise' ? halfSun(1)+up+horizon
    : kind==='sunset' ? halfSun(1)+down+horizon
    : halfSun(0.45)+horizon;
  return `<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">${inner}</svg>`;
}
function sunItem(label, time, kind){
  return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg)">${sunIcon(kind)}<div style="font-size:10.5px;opacity:.75">${label}</div><div style="font-size:14px;font-weight:800" dir="ltr">${time||'חסר'}</div></div>`;
}
function moonIcon(pct, waxing){
  if(pct==null) return '';
  const f = Math.max(0, Math.min(1, pct/100));
  const r = 10, c = 12;
  let lit;
  if(f >= 0.995) lit = `<circle cx="${c}" cy="${c}" r="${r}"/>`;
  else if(f <= 0.005) lit = '';
  else {
    const t = (Math.abs(2*f-1)*r).toFixed(2);
    const halfSweep = waxing ? 1 : 0;                       // waxing: right half lit
    const termSweep = waxing ? (f>=0.5?1:0) : (f>=0.5?0:1); // terminator bulge side
    lit = `<path d="M${c} ${c-r} A${r} ${r} 0 0 ${halfSweep} ${c} ${c+r} A${t} ${r} 0 0 ${termSweep} ${c} ${c-r} Z"/>`;
  }
  return `<svg width="20" height="20" viewBox="0 0 24 24" role="img" aria-label="ירח ${pct}% מואר (חישוב מקורב)" style="flex:none"><circle cx="${c}" cy="${c}" r="${r-0.5}" fill="#17253a" stroke="#3b4a63" stroke-width="1"/><g fill="#dbe4f3">${lit}</g></svg>`;
}
// Wind source-direction icon: the arrow points AT the compass quadrant the wind comes from
// (Open-Meteo wind_direction_10m is a from-bearing), matching the Hebrew adjective text.
function windIcon(deg){
  if(deg==null) return '';
  return `<svg width="18" height="18" viewBox="0 0 24 24" role="img" aria-label="חץ כיוון מקור הרוח" style="flex:none"><g transform="rotate(${deg} 12 12)" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="5"/><polyline points="7 10 12 4.5 17 10"/></g><circle cx="12" cy="12" r="10.5" fill="none" stroke="#3b4a63" stroke-width="1"/></svg>`;
}
// Adjectival wind-direction wording ("רוח דרום־מזרחית" = wind FROM the southeast).
function windAdj(deg){
  if(deg==null) return '';
  const a = ['צפונית','צפון־מזרחית','מזרחית','דרום־מזרחית','דרומית','דרום־מערבית','מערבית','צפון־מערבית'];
  return a[Math.round(((deg % 360) / 45)) % 8];
}
const ICON_UMB = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M23 12a11.05 11.05 0 0 0-22 0z"/><path d="M18 19a3 3 0 0 1-6 0v-7"/></svg>';
const ICON_DROP = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>';
const ICON_THERM = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>';
function windowDaylight(w,day){
  if(!day?.sunrise||!day?.sunset)return w.is_day;
  const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m;};
  const start=mins(w.from),end0=mins(w.to),end=end0<=start?end0+1440:end0;
  const daylight=Math.max(0,Math.min(end,mins(day.sunset))-Math.max(start,mins(day.sunrise)));
  return daylight>=(end-start)/2?1:0;
}
function wxLine(w,day){
  const items = [];
  const ic = wxIcon(w.wx_code, windowDaylight(w,day));
  if(ic) items.push(`<span class="wxi" title="מצב שמיים">${ic}</span>`);
  if(w.air_temp!=null) items.push(`<span class="wxi">${ICON_THERM}<bdi class="ltr">${Math.round(w.air_temp)}°</bdi></span>`);
  if(w.precip!=null) items.push(`<span class="wxi">${ICON_UMB}<bdi class="ltr">${w.precip} מ״מ</bdi></span>`);
  if(w.humidity!=null) items.push(`<span class="wxi">${ICON_DROP}<bdi class="ltr">${Math.round(w.humidity)}%</bdi></span>`);
  return items.length ? `<div class="wxline">${items.join('')}</div>` : '';
}
// Wind strength bands: site-defined local scale (km/h), not an official rating.
function windCat(k){
  if(k==null)return null;
  const c=LEVELS[windLevel(k)];
  return [c.name,c.color];
}
function stateChip(pair){ return pair?`<span class="stchip" style="background:${pair[1]};color:${pair[1]==='#111111'?'#ffffff':'#102030'};${pair[1]==='#111111'?'border:1px solid #64748b;':''}">${pair[0]}</span>`:''; }
function fmt(v, unit){ return v==null?null:v+(unit||''); }

async function loadJson(p){
  const immutable=p.startsWith('data/issues/');
  const url=immutable?p:p+(p.includes('?')?'&':'?')+'fresh='+Date.now();
  const r=await fetch(url,immutable?{}:{cache:'no-store'});
  if(!r.ok) throw new Error(p); return r.json();
}

(async function(){
  const appEl = document.getElementById('app');
  try {
  const params = new URLSearchParams(location.search);
  const issueParam = params.get('issue');
  const [beachesCfg, speciesCfg, latest] = await Promise.all([
    loadJson('data/beaches.json'), loadJson('data/species.json'),
    loadJson(issueParam ? 'data/issues/'+encodeURIComponent(issueParam)+'.json' : 'data/latest.json')
  ]);
  let officialIMS=latest.ims;
  if(!issueParam){ try { officialIMS=await loadJson('data/ims-latest.json'); } catch(e){ officialIMS=latest.ims; } }
  // Render config: archived issues carry a frozen snapshot so historical views never mutate.
  const snap = latest.snapshot || {};
  const spCfg = { species: snap.species || speciesCfg.species, coverage_note_he: snap.coverage_note_he || speciesCfg.coverage_note_he, data_quality_he: snap.data_quality_he || speciesCfg.data_quality_he, provenance_note_he: snap.provenance_note_he || speciesCfg.provenance_note_he, sources: snap.species_sources || speciesCfg.sources };
  const beachList = snap.beaches || beachesCfg.beaches;
  const spById = Object.fromEntries(spCfg.species.map(s=>[s.id,s]));
// IMS official coast forecast strip (only rendered when the issue carries an ims block;
// pipeline retrieval is gated behind IMS_ENABLE pending reuse-scope approval).
function compassHe(deg){
  if(deg==null||isNaN(deg)) return '';
  const dirs = ['צפון','צפון-מזרח','מזרח','דרום-מזרח','דרום','דרום-מערב','מערב','צפון-מערב'];
  return dirs[Math.round(((deg%360)+360)%360/45)%8];
}
function imsCard(region){
  const ims = officialIMS;
  if(!ims || !ims.available || !ims.regions || !ims.regions[region]) return '<div class="card imscard">תחזית IMS אינה זמינה · נתוני המודל מסומנים בנפרד</div>';
  const reg = ims.regions[region];
  const nowS = nowIL().date + ' ' + String(nowIL().hour).padStart(2,'0') + ':00:00';
  const slots=reg.slots.filter(s=>issueParam||s.valid_to>nowS);
  if(!slots.length) return '<div class="card imscard">תחזית IMS אינה בתוקף כרגע · הנתונים הבאים ממודל בלבד</div>';
  const slotLine = s => {
    const dm = iso => `${iso.slice(8,10)}/${iso.slice(5,7)}`;
    const span = `<bdi class="ltr">${dm(s.valid_from)} ${s.valid_from.slice(11,16)}–${dm(s.valid_to)} ${s.valid_to.slice(11,16)}</bdi>`;
    const waves = (s.wave_from_cm!=null&&s.wave_to_cm!=null) ? `<bdi class="ltr">${s.wave_from_cm}–${s.wave_to_cm}</bdi> ס״מ` : 'חסר';
    const wind = (s.wind_speed_from!=null&&s.wind_speed_to!=null) ? `<bdi class="ltr">${s.wind_speed_from}–${s.wind_speed_to}</bdi> קמ״ש` : 'חסר';
    const d1 = compassHe(s.wind_dir_from), d2 = s.wind_dir_to!=null&&s.wind_dir_to!==s.wind_dir_from ? compassHe(s.wind_dir_to) : '';
    const dir = s.wind_dir_from!=null ? 'מ'+d1+(d2?' עד '+d2:'') : '';
    const sea = s.sea_state_he ? ` · ${s.sea_state_he}` : '';
    const sst = s.sea_temp!=null ? ` · מי ים <bdi class="ltr">${s.sea_temp}°</bdi>` : '';
    return `<div class="imsslot"><span class="imst">${span}</span> גלים ${waves}${sea} · רוח ${wind} ${dir}${sst}</div>`;
  };
  return `<div class="card imscard">
    <div class="imstitle">IMS · תחזית חוף רשמית · ${reg.name_he}</div>
    ${slots.map(slotLine).join('')}
    <div class="imsattr">עדכון מקור ${ims.issued_at?`${ims.issued_at.slice(8,10)}/${ims.issued_at.slice(5,7)} ${ims.issued_at.slice(11,16)}`:'—'} · תחזית אזורית, לא מדידה בחוף</div>
  </div>`;
}

// Actual hourly model samples, connected linearly. Missing hours break the curve.
function officialWindow(region,day,w){
  if(issueParam) return null;
  const start=day.date+' '+w.from+':00';
  const end=w.to==='00:00'?new Date(Date.parse(day.date+'T12:00:00Z')+86400000).toISOString().slice(0,10)+' 00:00:00':day.date+' '+w.to+':00';
  const now=nowIL().date+' '+String(nowIL().hour).padStart(2,'0')+':00:00';
  const parts=(officialIMS?.regions?.[region]?.slots||[]).filter(s=>s.valid_to>now&&s.valid_from<end&&s.valid_to>start).sort((a,b)=>a.valid_from.localeCompare(b.valid_from));
  if(!parts.length||parts[0].valid_from>start||parts.at(-1).valid_to<end) return null;
  if(parts.length===1) return parts[0];
  if(parts.some((p,i)=>i&&parts[i-1].valid_to<p.valid_from)) return null;
  return {...parts[0],parts:parts.map(p=>({...p,overlap_from:p.valid_from>start?p.valid_from:start,overlap_to:p.valid_to<end?p.valid_to:end})),wave_to_cm:Math.max(...parts.map(p=>p.wave_to_cm)),wind_speed_to:Math.max(...parts.map(p=>p.wind_speed_to))};
}
function officialWaveChart(region){
  const now=nowIL().date+' '+String(nowIL().hour).padStart(2,'0')+':00:00';
  const slots=(officialIMS?.available?officialIMS?.regions?.[region]?.slots||[]:[]).filter(s=>(issueParam||s.valid_to>now)&&Number.isFinite(s.wave_from_cm)&&Number.isFinite(s.wave_to_cm)).sort((a,b)=>a.valid_from.localeCompare(b.valid_from));
  const title='<div class="wavechart-title" style="font-size:13px;font-weight:700">גובה גלים · תחזית חוף רשמית</div>';
  if(!slots.length) return '<div class="card wavechart">'+title+'<div style="font-size:12px;margin-top:12px;color:#94a3b8">אין טווח גלים רשמי בתוקף לגרף. לא הושלמו נתונים ממודל אחר.</div></div>';
  // Times are compared on a timezone-neutral axis. Only their actual interval lengths matter.
  const stamp=t=>Date.parse(t.replace(' ','T')+'Z');
  const first=stamp(slots[0].valid_from),last=stamp(slots.at(-1).valid_to);
  const W=328,H=230,left=31,right=318,top=45,base=169;
  const ceiling=Math.max(100,Math.ceil(Math.max(...slots.map(s=>s.wave_to_cm))/20)*20);
  const x=t=>right-(stamp(t)-first)/(last-first)*(right-left),y=v=>base-v/ceiling*(base-top);
  const ticks=Array.from({length:5},(_,i)=>ceiling*i/4).map(v=>`<line x1="${left}" x2="${right}" y1="${y(v)}" y2="${y(v)}" stroke="#25394d"/><text x="23" y="${y(v)+3}" text-anchor="end" font-size="9" fill="#94a3b8">${v}</text>`).join('');
  const bands=slots.map(s=>{const x1=x(s.valid_to),x2=x(s.valid_from),mid=(x1+x2)/2;return `<g><title>${s.valid_from} - ${s.valid_to}: ${s.wave_from_cm}–${s.wave_to_cm} ס״מ</title><rect x="${x1+2}" y="${y(s.wave_to_cm)}" width="${Math.max(1,x2-x1-4)}" height="${y(s.wave_from_cm)-y(s.wave_to_cm)}" fill="#2299d6" fill-opacity=".65" stroke="#38bdf8"/><text x="${mid}" y="${y(s.wave_to_cm)-10}" font-size="15" font-weight="700">${s.wave_from_cm}–${s.wave_to_cm}</text><text x="${mid}" y="192" font-size="10">${s.valid_from.slice(11,16)}–${s.valid_to.slice(11,16)}</text><text x="${mid}" y="211" font-size="10" fill="#94a3b8">${s.valid_from.slice(8,10)}/${s.valid_from.slice(5,7)}${s.valid_to.slice(0,10)!==s.valid_from.slice(0,10)?'–'+s.valid_to.slice(8,10)+'/'+s.valid_to.slice(5,7):''}</text></g>`;}).join('');
  return `<div class="card wavechart">${title}<div style="font-size:10px;color:#94a3b8;margin-top:5px">ס״מ · שטח צבוע: הטווח הרשמי, לא שינוי שעתי</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="טווחי גובה הגלים הרשמיים לפי זמן התוקף" style="display:block;width:100%;direction:ltr;font:12px Heebo,sans-serif;text-anchor:middle;fill:#e2e8f0">${ticks}${bands}</svg></div>`;
}

  let archive = null;
  try { archive = await loadJson('data/archive-index.json'); } catch(e){}

  let curRegion = 'center', curBeach = null, curDay = -1, curDate = null; // curDay -1 = uninitialized; curDate remembers the picked date across beach/region switches
  const BEACH_STORAGE_KEY = 'fishing.selectedBeach';
  try {
    const savedBeach = beachList.find(b=>b.id===localStorage.getItem(BEACH_STORAGE_KEY));
    if(savedBeach){ curBeach=savedBeach.id; curRegion=savedBeach.region; }
  } catch(e){} // Storage may be disabled; the selector must still work.
  function rememberBeach(){ try { localStorage.setItem(BEACH_STORAGE_KEY,curBeach); } catch(e){} }
  const app = document.getElementById('app');

  function beachData(id){ return latest.beaches.find(b=>b.id===id); }
  function beachCfg(id){ return beachList.find(b=>b.id===id); }
  // Render-time staleness of the whole issue (recomputed every render, not frozen at load).
  function issueAgeInfo(){ const ms = Date.now() - Date.parse(latest.meta.issued_at_utc); const h = Math.floor(ms/3.6e6);
    return { hours:h, old: ms > 30*3.6e6 }; }

  function render(){
    if(!curBeach || !beachList.some(b=>b.id===curBeach && b.region===curRegion)){
      curBeach = (beachList.find(b=>b.region===curRegion)||{}).id; curDay = -1; // re-resolve from curDate below
    }
    const bc = beachCfg(curBeach), bd = beachData(curBeach);
    const regionBeaches = beachList.filter(b=>b.region===curRegion);
    const age = issueAgeInfo();
    // Keep the user's picked date when switching beach/region; otherwise select the actual current date, not blindly day 0.
    if(bd && bd.days?.length && curDay<0){
      let di = curDate ? bd.days.findIndex(d=>d.date===curDate) : -1;
      if(di<0){ curDate = null; const nw0 = nowIL(); di = bd.days.findIndex(d=>d.date===nw0.date); }
      curDay = di>=0?di:0;
    }
    if(curDay<0) curDay = 0;
    const today = new Date().toLocaleDateString('sv-SE',{timeZone:latest.meta.timezone});

    let html = `<header>
      <h1>תחזית דייג</h1>
      ${issueParam?`<div class="issued">מוצגת הפקה מהארכיון (${latest.meta.issued_at_local.replace('T',' · ')}) - משמרת את הפרסום כפי שהיה; הערות חוקיות והמלצות עלולות להתיישן ואין לראות בהן היתר דיג עדכני</div>`:''}
      ${!issueParam&&(age.old||(latest.meta.valid_to&&latest.meta.valid_to<nowIL().date))?`<div class="issued"><span style="color:var(--warn-fg)">${age.old?`התחזית בת ${age.hours} שעות - ייתכן שהרענון היומי נכשל`:''}${age.old&&latest.meta.valid_to&&latest.meta.valid_to<nowIL().date?' · ':''}${latest.meta.valid_to&&latest.meta.valid_to<nowIL().date?`תוקף התחזית הסתיים ב-${latest.meta.valid_to} - כל ההמלצות היסטוריות`:''}</span></div>`:''}
    </header>
    <div class="tabs">${beachesCfg.regions.map(r=>`<div class="tab ${r.id===curRegion?'on':''}" data-region="${r.id}">${r.name_he}</div>`).join('')}</div>
    <select class="beachsel" aria-label="בחירת חוף">${regionBeaches.map(b=>`<option value="${b.id}" ${b.id===curBeach?'selected':''}>${b.name_he}</option>`).join('')}</select>
      <h3 class="sec">מגמת מודל בים · 7 הימים הבאים</h3>
      <div class="card"><div style="font-size:10px;opacity:.65;margin-bottom:6px">מודל משלים נפרד מ־IMS · לא גובה שבירה בחוף</div><div class="days">${bd.days.map((d,i)=>{
        const wd = HEB_DAYS[new Date(d.date+'T12:00:00').getDay()];
        const maxWind=d.wind_max_kmh??Math.max(...d.windows.map(w=>w.wind_max_kmh??w.wind_kmh).filter(x=>x!=null));
        const wl=waveLevel(d.wave_max), vl=Number.isFinite(maxWind)?windLevel(maxWind):null;
        const waveC=wl==null?null:LEVELS[wl],windC=vl==null?null:LEVELS[vl];
        const mini=(c,value,label)=>`<div style="margin-top:4px;padding:4px 1px;border-radius:7px;font-size:10px;font-weight:800;${c?`background:${c.color};color:${c.ink};${c.id==='black'?'outline:1px solid #94a3b8;':''}`:''}"><div style="font-size:8px;font-weight:400">${label}</div>${value}</div>`;
        return `<div class="day ${d.date===today?'today':''} ${i===curDay?'sel':''}" data-day="${i}">
          <div class="dd">${wd}</div><div class="dt">${d.date.slice(8,10)}.${d.date.slice(5,7)}</div>
          ${mini(waveC,waveRangeCm(d.wave_min,d.wave_max)||'חסר','מודל גלים · ס״מ')}
          ${mini(windC,vl==null?'חסר':`<bdi>${Math.round(maxWind)}</bdi>`,'מודל רוח · קמ״ש')}</div>`;
      }).join('')}</div></div>
    ${officialWaveChart(curRegion)}
    ${imsCard(curRegion)}
`;

    if(!bd || bd.missing){
      html += `<div class="card hero"><h2>${bc?bc.name_he:''}</h2><div class="stale-strip">${bd?bd.missing_note_he:'אין נתונים לחוף זה בהפקה הנוכחית'}</div></div>`;
    } else {
      const day = bd.days[Math.min(curDay, bd.days.length-1)];
      const day0 = bd.days[0];
      const waves = day.windows.map(w=>w.wave_height).filter(x=>x!=null);
      const wmin = waves.length?Math.min(...waves):null, wmax = waves.length?Math.max(...waves):null;
      const winds = day.windows.map(w=>w.wind_kmh).filter(x=>x!=null);
      const wMaxWind = winds.length?Math.max(...winds):null;
      const repWind = day.windows.find(w=>w.fromHour>=4&&w.fromHour<10)||day.windows[0];

      html += `<div class="card hero">
        <h2>${bc.name_he} · ${day.date===today?'היום':day.date} <span style="font-weight:400;font-size:11px;opacity:.6">${bc.terrain_he}</span></h2>
        ${bd.stale?`<div class="stale-strip">${bd.stale_note_he} (${bd.original_issued_at||''})</div>`:''}
        <div class="hero-grid">
          ${(()=>{ const lo=day.wave_min??wmin, hi=day.wave_max??wmax; const r=waveRangeCm(lo,hi);
            return `<div class="hg"><div class="k">גלים ממודל · שינוי יומי</div><div class="v">${r?r+' ס״מ '+stateChip(seaStateCm(Math.round(hi*100))):'חסר'}</div></div>`; })()}
          ${(()=>{ if(!repWind||repWind.wind_kmh==null) return `<div class="hg"><div class="k">מודל רוח (בוקר)</div><div class="v">חסר</div></div>`;
            const adj = windAdj(repWind.wind_deg);
            return `<div class="hg"><div class="k">מודל רוח (בוקר)</div><div class="v" style="display:flex;align-items:center;gap:6px">${windIcon(repWind.wind_deg)}<span style="white-space:nowrap">${windRangeKmh(repWind)} קמ״ש</span>${stateChip(windCat(repWind.wind_max_kmh??repWind.wind_kmh))}</div><div style="font-size:11px;font-weight:400;opacity:.75;margin-top:2px">${adj?'רוח '+adj:''}</div></div>`; })()}
          <div class="hg"><div class="k">מי ים</div><div class="v">${day.sst_avg!=null?day.sst_avg.toFixed(1)+'°':'חסר'}</div></div>
          ${(()=>{ const lo=day.salinity_min, hi=day.salinity_max;
            if(lo==null||hi==null) return `<div class="hg"><div class="k">מליחות</div><div class="v">חסר</div></div>`;
            const a=lo.toFixed(1), bb=hi.toFixed(1);
            const dist=bd.salinity_dist_km;
            return `<div class="hg" title="מליחות פני ים ממודל (Copernicus MEDSEA, רזולוציה ~4 ק״מ); תא הים התקף הקרוב ביותר לחוף - לא מדידה בחוף"><div class="k">מליחות</div><div class="v">${a===bb?`<bdi class="ltr">${bb}</bdi>`:`<bdi class="ltr">${a}–${bb}</bdi>`} PSU</div><div style="font-size:11px;font-weight:400;opacity:.75;margin-top:2px">מודל${dist?` · ~${dist} ק״מ מהחוף`:''}</div></div>`; })()}
          ${(()=>{ let lo=day.air_temp_min, hi=day.air_temp_max;
            if(lo==null||hi==null){ const ts=day.windows.map(w=>w.air_temp).filter(x=>x!=null); if(ts.length){ lo=Math.min(...ts); hi=Math.max(...ts); } }
            const txt = lo==null ? 'חסר' : (Math.round(lo)===Math.round(hi) ? `<bdi class="ltr">${Math.round(hi)}</bdi>°` : `<bdi class="ltr">${Math.round(lo)}–${Math.round(hi)}</bdi>°`);
            return `<div class="hg"><div class="k">אוויר (טווח היום)</div><div class="v">${txt}</div></div>`; })()}
          <div class="hg"><div class="k">ירח</div><div class="v" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px">${moonIcon(day.moon_illumination_pct, day.moon_waxing)}<span style="font-size:11px;font-weight:400;opacity:.75">${day.moon_illumination_pct}% מואר</span></div></div>
          ${(()=>{ let lo=day.pressure_min, hi=day.pressure_max;
            if(lo==null||hi==null){ const ps=day.windows.map(w=>w.pressure).filter(x=>x!=null); if(ps.length){ lo=Math.min(...ps); hi=Math.max(...ps); } }
            if(lo==null) return `<div class="hg"><div class="k">לחץ ברומטרי</div><div class="v">חסר</div></div>`;
            const a=Math.round(lo), b=Math.round(hi);
            return `<div class="hg"><div class="k">לחץ ברומטרי</div><div class="v">${a===b?`<bdi class="ltr">${b}</bdi>`:`<bdi class="ltr">${a}–${b}</bdi>`} hPa</div></div>`; })()}
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--inset-bg);border-radius:12px;padding:10px 6px;margin-top:8px">
          ${sunItem('אור ראשון', day.first_light, 'dawn')}
          ${sunItem('זריחה', day.sunrise, 'sunrise')}
          ${sunItem('שקיעה', day.sunset, 'sunset')}
          ${sunItem('אור אחרון', day.last_light, 'dusk')}
        </div>
        ${day.high_wave_warning?`<div class="warn-strip">⚠ גלים גבוהים (עד ${day.wave_max.toFixed(1)} מ׳) - זהירות מוגברת בחוף</div>`:''}
      </div>



      <div style="font-size:10px;color:#94a3b8">גלים ורוח מהתחזית הרשמית בטווח התוקף שמעל. חריגים מסומנים ״מודל״; הזרם והציון ממודל.</div>
      <h3 class="sec">תנאי ים לפי שעות · ${day.date===today?'היום':day.date}</h3>
      <div class="card winwrap">${!day.windows?.length?'<div style="padding:14px;font-size:12.5px;opacity:.75">אין נתוני חלונות ליום זה בהפקה הנוכחית.</div>':`<table class="win">
      <tr><th>שעות</th><th>גלים</th><th>רוח</th><th>זרם</th><th style="width:64px" title="ציון ניסיוני לגלים ורוח, לא הסתברות תפיסה ולא דירוג בטיחות">תנאים</th></tr>
      ${((!issueParam&&day.date===today)?day.windows.filter(w=>w.fromHour+((+w.to.slice(0,2))-w.fromHour+24)%24>nowIL().hour):day.windows).map(w=>{ const nw = nowIL(); const spanH = ((+w.to.slice(0,2))-w.fromHour+24)%24; const isPast = w.past || day.date<nw.date || (day.date===nw.date && w.fromHour+spanH<=nw.hour);
        const off=officialWindow(curRegion,day,w);
        return `<tr class="${isPast?'past':''}"><td class="hours-cell"><span dir="ltr">${w.from}–${w.to}</span>${wxLine(w,day)}</td><td>${off?`<div class="condition-cell">${stateChip([off.sea_state_he.replace(' עד ','–'),seaStateCm(off.wave_to_cm)[1]])}${off.parts?off.parts.map(p=>`<span style="font-size:10px"><bdi class="ltr">${p.overlap_from.slice(11,16)}–${p.overlap_to.slice(11,16)}</bdi><br><bdi class="ltr">${p.wave_from_cm}–${p.wave_to_cm} ס״מ</bdi></span>`).join(''):`<bdi class="ltr">${off.wave_from_cm}–${off.wave_to_cm} ס״מ</bdi>`}</div>`:(()=>{ const lo=w.wave_min??w.wave_height, hi=w.wave_max??w.wave_height; const r=waveRangeCm(lo,hi); return r?`<div class="condition-cell"><span style="font-size:9px;color:#94a3b8">מודל</span>${stateChip(seaStateCm(Math.round(hi*100)))}<div><span style="font-weight:700">${r}</span> ס״מ</div></div>`:na(null); })()}</td>
        <td>${off?`<div class="condition-cell">${stateChip(windCat(off.wind_speed_to))}${(off.parts||[off]).map(p=>`<span style="font-size:10px">${p.overlap_from?`<bdi class="ltr">${p.overlap_from.slice(11,16)}–${p.overlap_to.slice(11,16)}</bdi><br>`:''}<bdi class="ltr">${p.wind_speed_from}–${p.wind_speed_to} קמ״ש</bdi><br>מ${compassHe(p.wind_dir_from)}${p.wind_dir_to!==p.wind_dir_from?' עד '+compassHe(p.wind_dir_to):''}</span>`).join('')}</div>`:(()=>{ const t=windRangeKmh(w); return t?`<div class="condition-cell"><span style="font-size:9px;color:#94a3b8">מודל</span>${stateChip(windCat(w.wind_max_kmh??w.wind_kmh))}<div>${t} קמ״ש</div>${w.wind_dir?`<div>מ${w.wind_dir}</div>`:''}</div>`:'חסר'; })()}</td>
        <td>${w.current_vel!=null&&w.current_vel>0.01?w.current_vel+' קמ״ש '+(w.current_dir?'ל'+w.current_dir:''):'—'}</td>
        <td style="vertical-align:middle">${(()=>{const score=off?null:windowScore(w.wave_height,w.wind_kmh,w.gust_kmh);return `<div title="ציון ניסיוני לגלים ורוח, לא הסתברות תפיסה ולא דירוג בטיחות" style="display:flex;align-items:center;justify-content:center;gap:6px"><bdi class="ltr" style="font-size:13px;font-weight:800;color:${scoreColor(score)}">${score==null?'—':score}</bdi><span class="bar" style="display:inline-block;min-width:0;width:38px;flex:0 0 38px"><i style="width:${score??0}%;background:${scoreColor(score)}"></i></span></div>`})()}</td></tr>`;}).join('')}
      </table>`}</div>

      <h3 class="sec">דגי טורפים · ז'ירז'ור מהחוף</h3>
      <div class="sp-grid">${day.species.map(sp=>{
        const cfg = spById[sp.id]||{};
        return `<div class="card sp">
          <div class="nm">${cfg.name_he||sp.id}</div>
          <div class="lt">${cfg.name_lat||''}</div>
          ${cfg.name_he_official&&cfg.name_he_official!==cfg.name_he?`<div class="official">שם רשמי: ${cfg.name_he_official}</div>`:''}
          ${cfg.ambiguity_note_he?`<div class="official">⚠ ${cfg.ambiguity_note_he}</div>`:''}
          ${cfg.advice_he?`<div style="font-size:11.5px;line-height:1.6;opacity:.9;margin-top:4px">${cfg.advice_he}</div>`:''}
          ${cfg.season_he?`<div style="font-size:11.5px;line-height:1.6;opacity:.9;margin-top:4px"><b>עונה:</b> ${cfg.season_he}</div>`:''}
          ${cfg.timing_he?`<div style="font-size:11.5px;line-height:1.6;opacity:.9;margin-top:2px"><b>זמנים:</b> ${cfg.timing_he}</div>`:''}
          ${cfg.conditions_he?`<div style="font-size:11.5px;line-height:1.6;opacity:.9;margin-top:2px"><b>תנאים:</b> ${cfg.conditions_he}</div>`:''}
          ${cfg.legal_note_he?`<div class="official">⚖ ${cfg.legal_note_he}</div>`:''}
        </div>`;
      }).join('')}</div>
    `;
    }

    html += `
    <footer>
      מזג אוויר וים: Open-Meteo (CC BY 4.0)${latest.ims?.available?` · תחזית חופים רשמית: השירות המטאורולוגי הישראלי (שמ״ט), ims.gov.il - אינו נושא באחריות למידע או לשימוש בו, ואינו צד לפרסומו`:''}${latest.beaches?.some(b=>b.days?.some(d=>d.salinity_min!=null))?`<br>מליחות: Generated using E.U. Copernicus Marine Service Information · <a href="https://doi.org/10.48670/mds-00359" target="_blank" rel="noopener">DOI 10.48670/mds-00359</a>`:''}<br>
      תחזית ניסיונית לתכנון בלבד - לא אחוז תפיסה ולא הבטחה לבטיחות; בדקו תקנות דיג לפני היציאה.<br>
      הופק ${latest.meta.issued_at_local.replace('T',' · ')} · מתעדכן מדי ערב בסביבות 20:00
    </footer>`;

    app.innerHTML = html;
    app.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{curRegion=t.dataset.region;curBeach=null;curDay=-1;render();rememberBeach();});
    app.querySelector('.beachsel').onchange=e=>{curBeach=e.target.value;curDay=-1;render();rememberBeach();};
    app.querySelectorAll('.day').forEach(d=>d.onclick=()=>{curDay=+d.dataset.day;curDate=bd.days[curDay]?bd.days[curDay].date:null;render();});
  }
  try { render(); } catch(e){ app.innerHTML = 'שגיאה בטעינת הנתונים: '+e.message; }
  // Live re-render: past windows, best-window recommendation and issue-age warning are computed
  // at render time, so an open page stays truthful as time passes.
  if(!issueParam) setInterval(async()=>{try{officialIMS=await loadJson('data/ims-latest.json');const y=scrollY;render();scrollTo(0,y);}catch(e){}},3600000);
  let lastSig = '';
  setInterval(()=>{ const nw = nowIL(); const age = issueAgeInfo(); const sig = nw.date+'|'+nw.hour+'|'+age.old;
    if(sig!==lastSig){ lastSig=sig; const y=window.scrollY; try{ render(); }catch(e){} window.scrollTo(0,y); } }, 60000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ lastSig=''; } });
  } catch(e){
    appEl.innerHTML = `<div class="card" style="text-align:center;padding:30px 16px">
      <h2 style="margin:0 0 8px">טעינת הנתונים נכשלה</h2>
      <div style="font-size:12px;opacity:.7;margin-bottom:14px">יתכן שקובץ התחזית חסר או שיש בעיית תקשורת. הנתונים הקודמים לא נפגעו.</div>
      <button onclick="location.reload()" style="background:var(--accent);color:#04222e;border:0;border-radius:9px;padding:10px 22px;font:700 14px Heebo;cursor:pointer">נסה שוב</button>
    </div>`;
  }
})();
</script>
</body></html>
