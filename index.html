<script id="release-check">
(()=>{
 const current='63cb65b54de3cfacdd1e';let checking=false;
 async function check(){
  if(checking||document.hidden||document.querySelector('dialog[open]')||!navigator.onLine)return;
  checking=true;
  try{
   const r=await fetch('release.json?t='+Date.now(),{cache:'no-store'});
   if(!r.ok)return;
   const next=await r.json();
   if(next.version&&next.version!==current){
    // A distinct entry URL bypasses a cached HTML response while preserving selection/archive params.
    const u=new URL(location.href);if(u.searchParams.get('_release')===next.version)return;try{sessionStorage.setItem('fishing.releaseView',JSON.stringify({date:document.querySelector('.day.sel')?.dataset.date,scroll:scrollY}));}catch(e){}u.searchParams.set('_release',next.version);location.replace(u);
   }
  }catch(e){}finally{checking=false;}
 }
 addEventListener('focus',check);document.addEventListener('visibilitychange',check);
 setInterval(check,300000);check();
})();
</script>

 sea:{title:'טמפרטורת מי הים',what:'הממוצע היומי של תחזיות טמפרטורת פני הים הזמינות, במעלות צלזיוס. זה נתון ממודל ימי, לא מדחום בחוף, ולא בהכרח הטמפרטורה בעומק שבו הדג נמצא.',effect:'טמפרטורת המים היא חלק מבית הגידול ומשפיעה על תפוצת דגים וטרפם. התגובה תלויה במין ובמקום. אין כאן טווח טמפרטורה שמוכיח שדג טורף יתקוף דמוי בחוף הזה.',links:[[habitat,'NOAA · טמפרטורה ובית גידול'],['https://open-meteo.com/en/docs/marine-weather-api','הגדרת נתון פני הים']]},
 salt:{title:'מליחות',what:'ריכוז המלחים במי הים, מוצג בסולם המליחות המעשי PSU. הכרטיס מציג את הטווח היומי הזמין ממודל Copernicus ברזולוציה של כ־4 ק״מ, בתא ים סמוך. זו אינה מדידה בשפת המים.',effect:'מליחות היא חלק מבית הגידול ומשפיעה על התפוצה של מינים שונים. לא כל הדגים מגיבים באותו אופן. אין לנו סף מליחות מאומת לזירז׳ור בחופי ישראל, ולכן הנתון אינו מתורגם כאן להמלצת דיג.',links:[[habitat,'NOAA · מליחות ובית גידול'],['https://data.marine.copernicus.eu/product/MEDSEA_ANALYSISFORECAST_PHY_006_013/description','Copernicus · המודל והרזולוציה']]},
 air:{title:'טמפרטורת האוויר',what:'הטמפרטורה הנמוכה והגבוהה בתחזית לאורך היום שנבחר, מעוגלות למעלות. תחזית האוויר מתייחסת לגובה של 2 מטר מעל הקרקע; זו אינה טמפרטורת המים.',effect:'שימושי בעיקר לתכנון הלבוש והשהייה בחוף. אין להסיק שטמפרטורת האוויר היא טמפרטורת בית הגידול של הדג. מחקרי תפיסות במינים ובאזורים אחרים אינם נותנים כאן כלל מקומי של חם = טוב או קר = רע.',links:[['https://open-meteo.com/en/docs','הגדרת נתוני מזג האוויר'],['https://link.springer.com/article/10.1007/s42452-023-05379-8','מחקר · השפעות תלויות מין ואזור']]},
 pressure:{title:'לחץ ברומטרי ושינויי 48 שעות',what:'הטווח הגדול בכרטיס הוא לחץ האוויר החזוי ביום שנבחר, מתוקן לפני הים, ביחידות hPa. מתחתיו נתון יומי קבוע: השינוי הגדול ביותר בערך מוחלט בין שתי שעות המרוחקות 24 שעות, מתוך 48 השעות שלפני 00:00 בתחילת היום שנבחר, בשעון ישראל. הסימן מראה את כיוון אותו שינוי, לא בהכרח את המגמה עכשיו. טמפרטורה כאן היא טמפרטורת פני הים. שינוי חריג מוגדר מעל האחוזון ה־95 של אותו חישוב ב־30 חלונות קודמים, המסתיימים לפחות 48 שעות לפני החיתוך. החלונות חופפים ואינם ניסויים עצמאיים. זה סף סטטיסטי מקומי, לא סף ביולוגי. נדרשות 48 שעות מלאות לחישוב ו־30 חלונות מלאים לסיווג; אחרת מוצג חוסר נתונים. הנתון מחושב ברענון הראשון לאחר תחילת היום ואז נשמר ללא שינוי. יום עתידי אינו מקבל נתון עבר לפני שהגיע. הנתונים הם מודלים של העבר הקרוב, לא מדידות בחוף ולא תחזית שידוע שהייתה זמינה בזמן עבר.',effect:'לחץ ומערכות מזג אוויר קשורים זה לזה, אבל מהמספר הזה לבדו אין בסיס לקבוע שעת אכילה של דגים. זה תיאור שינוי בתנאים, לא הסתברות תפיסה ולא מדד בטיחות. הוא אינו משנה את ציון התנאים הקיים.',links:[['https://open-meteo.com/en/docs','לחץ מתוקן לפני הים ונתוני עבר קרוב'],['https://open-meteo.com/en/docs/marine-weather-api','טמפרטורת פני הים ממודל']]},
 moon:{title:'ירח',what:'אחוז הדסקה המוארת של הירח והאם הוא מתמלא או מתמעט, בחישוב יומי מקורב. זה לא אחוזי תפיסה, לא אחוז הארה בחוף ולא תחזית גאות. אור בפועל תלוי גם בשעת זריחת הירח, בעננות ובסביבה, שאינן נלמדות מהאחוז לבדו.',effect:'במחקרים מסוימים נמצא קשר בין מחזור הירח לתפיסות, ובאחרים לא נמצא קשר. ההשפעה תלויה במין ובמקום. המחקרים המקושרים הם על דגי מים מתוקים בצפון אמריקה, לא אימות לזירז׳ור בחופי ישראל; לכן לא מוצגות כאן שעות אכילה או הבטחת תפיסה לפי הירח.',links:[['https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0098046','מחקר · קשר בחלק מתפיסות מוסקי'],['https://link.springer.com/article/10.1007/s42452-023-05379-8','מחקר · ללא קשר בתפיסות פורל']]}
 };

// Wave range in cm from hourly min/max (honest temporal spread, not an uncertainty band).
// Exact cm (data is 2-decimal meters = 1cm precision), ascending min-max, LTR-isolated.
function waveRangeCm(lo, hi){
  if(lo==null||hi==null) return null;
  const loCm = Math.round(lo*100), hiCm = Math.round(hi*100);
  return loCm===hiCm ? `<bdi class="ltr">${hiCm}</bdi>` : `<bdi class="ltr">${loCm}–${hiCm}</bdi>`;
}
// Sustained-wind range inside a window (km/h), same honest-range approach as waves; gusts stay separate.
function windRangeKmh(w){
  const lo = w.wind_min_kmh ?? w.wind_kmh, hi = w.wind_max_kmh ?? w.wind_kmh;
  if(lo==null||hi==null) return null;
  const a = Math.round(lo), b = Math.round(hi);
  return a===b ? `<bdi class="ltr">${b}</bdi>` : `<bdi class="ltr">${a}–${b}</bdi>`;
}
// Sea state with official IMS Hebrew terms (CodesForIMSWebSite, matching Douglas degrees),
// classified by the displayed rounded cm so label and number always agree.
function seaStateCm(cm){
  if(cm==null) return null;
  const color=LEVELS[waveLevel(cm/100)].color;
  if(cm<10) return ['שקט',color];
  if(cm<50) return ['נוח',color];
  if(cm<125) return ['גלי',color];
  if(cm<250) return ['גבה גלים',color];
  if(cm<400) return ['רוגש',color];
  if(cm<600) return ['סוער',color];
  return ['גועש',color];
}

  const moon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  const cloud = '<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>';
  const partlyD = '<circle cx="7" cy="7" r="2.6"/><line x1="7" y1="1.5" x2="7" y2="3"/><line x1="1.5" y1="7" x2="3" y2="7"/><line x1="3.2" y1="3.2" x2="4.3" y2="4.3"/><line x1="10.8" y1="3.2" x2="9.7" y2="4.3"/><path d="M19 13h-1.1A6.5 6.5 0 1 0 8.5 21.5H19a4 4 0 0 0 0-8z"/>';
  const partlyN = '<path d="M12.5 2.5A5.5 5.5 0 1 0 18 8.5 4.3 4.3 0 0 1 12.5 2.5z"/><path d="M19 13h-1.1A6.5 6.5 0 1 0 8.5 21.5H19a4 4 0 0 0 0-8z"/>';
  const drops = '<line x1="8" y1="19" x2="8" y2="21"/><line x1="13" y1="16" x2="13" y2="19"/><line x1="18" y1="19" x2="18" y2="21"/>';
  if(code==null) return '';
  if(code===0||code===1) return isDay===0 ? S(moon,'#cbd5e1') : S(sun,'#fbbf24');
  if(code===2) return isDay===0 ? S(partlyN,'#94a3b8') : S(partlyD,'#fbbf24');
  if(code===3) return S(cloud,'#94a3b8');

  if(code>=51&&code<=57) return S(cloud+drops,'#67e8f9');
  if((code>=61&&code<=67)||(code>=80&&code<=82)) return S(cloud+drops,'#60a5fa');
  if((code>=71&&code<=77)||code===85||code===86) return S(cloud+'<line x1="8" y1="19" x2="8.01" y2="19"/><line x1="12" y1="21" x2="12.01" y2="21"/><line x1="16" y1="19" x2="16.01" y2="19"/>','#e2e8f0');

  return S(cloud,'#94a3b8');
}

}

function windowModelHeights(bd,day,w){
  const labels={copernicus_med:'Copernicus',ecmwf_wam:'ECMWF',ncep_gfswave025:'GFS',open_meteo_best_match:'מודל משולב'};
  const span=((+w.to.slice(0,2))-w.fromHour+24)%24;
  const rows=Object.entries(bd.wave_provenance?.model_series||{}).map(([id,s])=>{
    const values=s.hourly.filter(r=>r.time.slice(0,10)===day.date && +r.time.slice(11,13)>=w.fromHour && +r.time.slice(11,13)<w.fromHour+span && Number.isFinite(r.height)).map(r=>r.height);
    return `<div style="margin:4px 0"><bdi style="font-size:9px;opacity:.75">${labels[id]||id}</bdi><br><bdi style="font-size:11px;font-weight:700;white-space:nowrap">${values.length?waveRangeCm(Math.min(...values),Math.max(...values)):'חסר'}</bdi>${values.length&&values.length<span?`<span style="font-size:8px"> (${values.length}/${span})</span>`:''}</div>`;
  });
  return `<div class="window-model-heights" style="line-height:1.3"><span style="font-size:9px;color:#94a3b8">מודלים · ס״מ</span>${rows.join('')}</div>`;
}

  const cells=c.models.filter(m=>m.cell_lat!=null).map(m=>`<div><bdi>${m.label.replace(/Open-Meteo/g,'מודל משולב')}: ${m.cell_lat}, ${m.cell_lon}</bdi>${m.dist_km!=null?` · ~${m.dist_km} ק״מ מהחוף`:''}</div>`).join('');

  return `<div class="card model-compare" style="padding:13px 15px"><div style="font-size:13px;font-weight:700">השוואת מודלי גלים · ${day.date.slice(8,10)}.${day.date.slice(5,7)}</div><div style="font-size:10px;opacity:.65;margin-top:3px">טווח השינוי היומי בים · לא גובה שבירה בחוף</div>${rows}<div style="font-size:12px;margin-top:9px;color:var(--warn-fg)">${c.max_spread==null?'אין מספיק שעות משותפות להשוואה':`פער בין מודלים עד <bdi>${Math.round(c.max_spread*100)}</bdi> ס״מ באותה שעה`}</div><details style="font-size:10px;line-height:1.7;opacity:.7;margin-top:5px"><summary>כיסוי ומקורות</summary>${c.matched_hours} שעות בהשוואה של שני מודלים לפחות. הפער אינו טווח ביטחון או מדד דיוק; התאים והמודלים שונים, ואינם עצמאיים לחלוטין.${cells}${cpTime?`<div>משיכת Copernicus: <bdi>${new Intl.DateTimeFormat('sv-SE',{timeZone:latest.meta.timezone,dateStyle:'short',timeStyle:'short'}).format(new Date(cpTime))}</bdi> · שעון ישראל</div>`:''}<div>גלים: גובה משמעותי ממודל. ללא ממוצע בין המודלים וללא כיול לחוף.</div></details></div>`;

      }).join('')}</div></div>

`;

    if(!bd || bd.missing){
      html += `<div class="card hero"><h2>${bc?bc.name_he:''}</h2><div class="stale-strip">${bd?bd.missing_note_he:'אין נתונים לחוף זה בהפקה הנוכחית'}</div></div>`;
    } else {
      const day = bd.days[Math.min(curDay, bd.days.length-1)];

        const off=officialWindow(curRegion,day,w);
        return `<tr class="${isPast?'past':''}"><td class="hours-cell"><span dir="ltr">${w.from}–${w.to}</span>${wxLine(w,day)}</td><td>${off?`<div class="condition-cell">${stateChip([(off.sea_state_he||'מצב ים').replace(' עד ','–'),seaStateCm(off.wave_to_cm)[1]])}${off.parts?off.parts.map(p=>`<span style="font-size:10px"><bdi class="ltr">${p.overlap_from.slice(11,16)}–${p.overlap_to.slice(11,16)}</bdi><br><bdi class="ltr">${p.wave_from_cm}–${p.wave_to_cm} ס״מ</bdi></span>`).join(''):`<bdi class="ltr">${off.wave_from_cm}–${off.wave_to_cm} ס״מ</bdi>`}</div>`:(()=>{ const lo=w.wave_min??w.wave_height, hi=w.wave_max??w.wave_height; const r=waveRangeCm(lo,hi); if(latest.meta.version>=5)return windowModelHeights(bd,day,w); return r?`<div class="condition-cell"><span style="font-size:9px;color:#94a3b8">${bd.wave_primary==='copernicus_med'?'Copernicus':'מודל משולב'}</span>${stateChip(seaStateCm(Math.round(hi*100)))}<div><span style="font-weight:700">${r}</span> ס״מ</div></div>`:na(null); })()}</td>
        <td>${(()=>{ const t=windRangeKmh(w); return t?`<div class="condition-cell">${stateChip(windCat(w.wind_max_kmh??w.wind_kmh))}<div>${t} קמ״ש</div>${w.wind_dir?`<div>מ${w.wind_dir}</div>`:''}</div>`:'חסר'; })()}</td>
        <td>${w.current_vel!=null&&w.current_vel>0.01?w.current_vel+' קמ״ש '+(w.current_dir?'ל'+w.current_dir:''):'—'}</td>
        <td>${conditionsCell(bd,day,w)}</td></tr>`;}).join('')}
      </table>`}</div>


    `;
    }

    html += `
    <footer>
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a> · נתונים עובדו לטווחים ולתצוגה${latest.meta.version>=5?' · מודלי גלים: ECMWF WAM, NOAA GFS Wave':''}${latest.meta.version>=5?`<br>גלי הים התיכון: Generated using E.U. Copernicus Marine Service Information · <a href="https://doi.org/10.48670/mds-00373" target="_blank" rel="noopener">DOI 10.48670/mds-00373</a>`:''}${latest.ims?.available?` · תחזית חופים רשמית: השירות המטאורולוגי הישראלי (שמ״ט), ims.gov.il - אינו נושא באחריות למידע או לשימוש בו, ואינו צד לפרסומו`:''}${latest.beaches?.some(b=>b.days?.some(d=>d.salinity_min!=null))?`<br>מליחות: Generated using E.U. Copernicus Marine Service Information · <a href="https://doi.org/10.48670/mds-00359" target="_blank" rel="noopener">DOI 10.48670/mds-00359</a>`:''}<br>
      תחזית ניסיונית לתכנון בלבד - לא אחוז תפיסה ולא הבטחה לבטיחות; בדקו תקנות דיג לפני היציאה.<br>
      הופק ${latest.meta.issued_at_local.replace('T',' · ')} · רענון נתונים מתוכנן כל 3 שעות
      <br><span style="display:inline-block;margin-top:10px">© 2026 <bdi>Ruslan Medov</bdi> · כל הזכויות שמורות לעיצוב האתר ולקוד המקורי.<br>נתוני צד שלישי כפופים לרישיונות המקור.</span>
    </footer>`;

    if(bd?.days?.length){
      const helpDay=bd.days[Math.min(curDay,bd.days.length-1)];
      const hw=helpDay.windows.find(w=>w.fromHour>=4&&w.fromHour<10)||helpDay.windows[0];
      if(hw) html+=`<dialog class="wind-dialog" aria-labelledby="wind-help-title"><h2 id="wind-help-title">רוח בוקר</h2><p>ביום שנבחר, בין <bdi>${hw.from}–${hw.to}</bdi> לפי שעון ישראל.</p><p>המספרים הם המהירות הנמוכה והגבוהה בתחזיות השעתיות בטווח הזה, מעוגלות לקמ״ש. זה לא ממוצע יומי ולא משבי רוח.</p><p>הכיוון הוא הכיוון שממנו הרוח נושבת, לפי ממוצע מעגלי של הכיוונים באותן שעות.</p><p>הנתון בכרטיס הוא תחזית ממודל מזג אוויר בגובה 10 מטר, לא מדידה ולא התחזית הרשמית של IMS. אותה סדרת רוח מוצגת גם בטבלה ובבחירת הימים. תחזית הרוח האזורית של IMS נשארת בהודעה הרשמית הנפרדת ואינה מחליפה את הרוח בטבלה.</p><p>בבחירת הימים למעלה, החץ מציג את כיוון רוח הבוקר של אותו יום, כמו בכרטיס הזה. המספרים הצבעוניים מעל החץ הם טווח המהירויות באותו בוקר, כמו בכרטיס הזה. הצבע נקבע לפי המהירות הגבוהה בטווח הבוקר, לא לפי שיא הרוח היומי. החץ מצביע אל הכיוון שממנו נושבת הרוח.</p><p><b>השפעה על דיג:</b> הרוח משפיעה על תנאי ההטלה ועל פני המים. אין כיוון רוח שמבטיח תפיסה לכל מין וחוף. סולם הצבעים הוא תיאור עוצמה מקומי, לא אישור בטיחות. הרוח והמשבים נכנסים למדד התנאים הניסיוני, אך המדד אינו מאומת לתפיסות בחוף.</p><details style="font-size:12px"><summary>מקורות</summary><p><a href="https://open-meteo.com/en/docs" target="_blank" rel="noopener" style="color:var(--accent)">הגדרת תחזית הרוח</a></p><p><a href="https://www.takemefishing.org/fly-fishing/fly-casting/wind-casting-technique/" target="_blank" rel="noopener" style="color:var(--accent)">רוח והטלה · מדריך כללי לדיג בזבוב, לא אימות תפיסות בזירז׳ור בישראל</a></p></details><form method="dialog"><button>סגירה</button></form></dialog>`;
    }
    app.innerHTML = html;
    const summaryKinds={'מי ים':'sea','מליחות':'salt','אוויר (טווח היום)':'air','לחץ ברומטרי':'pressure','ירח':'moon'};
    app.querySelectorAll('.hero-grid .hg .k').forEach(label=>{const kind=summaryKinds[label.textContent.trim()];if(kind){label.insertAdjacentHTML('beforeend',summaryDatumIcon(kind));label.insertAdjacentHTML('afterend',summaryHelp(kind));if(kind==='pressure'){label.insertAdjacentHTML('beforeend',`<button class="fish-help" type="button" aria-label="הערכת דיג" aria-haspopup="dialog" style="cursor:pointer;background:var(--inset-bg);border:1px solid var(--border);border-radius:50%;color:var(--accent);width:30px;height:30px;margin-inline-start:4px;font-size:18px">🐟</button>`);}}});
    const helpButton=app.querySelector('.wind-help'), helpDialog=app.querySelector('.wind-dialog:not(.score-dialog):not(.datum-dialog)');
    if(helpButton&&helpDialog){helpButton.onclick=()=>helpDialog.showModal();helpDialog.onclick=e=>{if(e.target===helpDialog){const r=helpDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)helpDialog.close();}};}

    if(bd?.days?.length){
      const fd=bd.days[Math.min(curDay,bd.days.length-1)],hist=change48.days?.[fd.date]?.beaches?.[bd.id];
      const histLine=fd.date>nowIL().date?'שינויי 48 השעות שלפני יום זה עדיין אינם ידועים.':hist?.pressure?.available&&hist?.sst?.available?`ב־48 השעות שלפני תחילת היום, השינוי הגדול ב־24 שעות היה ${hist.pressure.signed_change_24h>0?'+':''}${hist.pressure.signed_change_24h.toFixed(1)} hPa בלחץ ו־${hist.sst.signed_change_24h>0?'+':''}${hist.sst.signed_change_24h.toFixed(1)}°C במי הים. ${hist.pressure.unusual_relative_to_month||hist.sst.unusual_relative_to_month?'נמצא שינוי חריג ביחס לחודש הקודם.':hist.pressure.unusual_relative_to_month!=null&&hist.sst.unusual_relative_to_month!=null?'לא נמצא שינוי חריג ביחס לחודש הקודם.':'אין די נתונים לסיווג חריגות.'}`:'אין די נתוני עבר לשינויי הלחץ וטמפרטורת הים.';
      const env=latest.environment_history?.date===fd.date?latest.environment_history.beaches?.[bd.id]:null;
      const pastLine=env&&env.wave.max!=null&&env.wind.max!=null?`ב־48 השעות שלפני היום, שיא הגל במודל היה ${Math.round(env.wave.max*100)} ס״מ ושיא הרוח ${Math.round(env.wind.max)} קמ״ש. `:'אין נתוני גלים ורוח מלאים ל־48 השעות שלפני היום שנבחר. ';
      const peak=Number.isFinite(fd.wave_max)?`תחזית הגל המרבי ביום זה: ${Math.round(fd.wave_max*100)} ס״מ לפי ${bd.wave_primary==='copernicus_med'?'Copernicus':'המודל הזמין'}. `:'';
      const dialog=document.createElement('dialog');dialog.className='wind-dialog fish-dialog';dialog.innerHTML=`<h2>הערכת דיג · ${fd.date}</h2><p>${fishingAssessment({day:fd,series:bd.wave_provenance?.model_series,official:(issueParam?latest.ims:officialIMS)?.regions?.[curRegion]?.slots||[],stale:bd.stale})}</p><p>${histLine.replace(/[0-9][0-9:–.,]*/g,n=>'\u2066'+n+'\u2069')}</p><p>${(pastLine+peak).replace(/[0-9][0-9:–.,]*/g,n=>'\u2066'+n+'\u2069')}אלה נתוני ים ורוח, לא סיווג סערה רשמי.</p><p>${clarityAssessment({day:fd,history:latest.environment_history?.beaches?.[bd.id],retrievedAt:latest.environment_history?.retrieved_at,official:(issueParam?latest.ims:officialIMS)?.regions?.[curRegion]?.slots||[]})}</p><details style="font-size:11px;opacity:.65"><summary>על הערכת הצלילות</summary>כלל עבודה ניסיוני מקומי, לא סף מדעי מאומת: נטייה לצלילות רק אם בכל 48 השעות הגלים עד 75 ס״מ, הרוח עד 15 קמ״ש וסך הגשם פחות מ־1 מ״מ. חריגה מהכלל משאירה את ההערכה לא חד־משמעית ואינה הוכחה לעכירות. תחזית IMS אזורית לרוח או גלים חזקים יותר מונעת מסקנת צלילות על סמך מודל נקודתי מתון. אין מדידת משקע, נגר מנחלים, פריחת אצות או צילום חי. גשם בנקודת החוף אינו מייצג בהכרח את כל אגן הניקוז. גם ריף סלעי אינו מבטיח מים צלולים. <a href="https://oceanservice.noaa.gov/education/tutorial_estuaries/est10_monitor.html" target="_blank" rel="noopener">NOAA: גורמי עכירות</a></details><p style="font-size:11px;opacity:.65">תיאור תנאים ממודלים ומתחזית IMS היכן שזמינה, לא תחזית תפיסות. שינויי העבר הם נתון קבוע עד 00:00 בתחילת היום.</p><form method="dialog"><button>סגירה</button></form>`;app.append(dialog);const button=app.querySelector('.fish-help');if(button)button.onclick=()=>dialog.showModal();
    }
    app.querySelectorAll('.summary-datum-icon').forEach(button=>{const dialog=button.parentElement.nextElementSibling;button.onclick=()=>dialog.showModal();dialog.onclick=e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}};});
    app.querySelectorAll('.score-help').forEach(button=>{const dialog=button.nextElementSibling;button.onclick=()=>dialog.showModal();dialog.onclick=e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}};});
    app.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{curRegion=t.dataset.region;curBeach=null;curDay=-1;render();rememberBeach();});
    app.querySelector('.beachsel').onchange=e=>{curBeach=e.target.value;curDay=-1;render();rememberBeach();};
    app.querySelectorAll('.day').forEach(d=>d.onclick=()=>{curDay=+d.dataset.day;curDate=bd.days[curDay]?bd.days[curDay].date:null;render();});
  }
  try { render(); } catch(e){ app.innerHTML = 'שגיאה בטעינת הנתונים: '+e.message; }
  // Live re-render: past windows, best-window recommendation and issue-age warning are computed
  // at render time, so an open page stays truthful as time passes.
  if(releaseView)requestAnimationFrame(()=>scrollTo(0,Number(releaseView.scroll)||0));
  if(!issueParam) setInterval(async()=>{try{officialIMS=await loadJson('data/ims-latest.json');const y=scrollY;render();scrollTo(0,y);}catch(e){}},3600000);
  let lastSig = '';
  setInterval(()=>{ const nw = nowIL(); const age = issueAgeInfo(); const sig = nw.date+'|'+nw.hour+'|'+age.old;
    if(sig!==lastSig){ lastSig=sig; const y=window.scrollY; try{ render(); }catch(e){} window.scrollTo(0,y); } }, 60000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ lastSig=''; } });
  } catch(e){
    appEl.innerHTML = `<div class="card" style="text-align:center;padding:30px 16px">
      <h2 style="margin:0 0 8px">טעינת הנתונים נכשלה</h2>
      <div style="font-size:12px;opacity:.7;margin-bottom:14px">יתכן שקובץ התחזית חסר או שיש בעיית תקשורת. הנתונים הקודמים לא נפגעו.</div>
      <button onclick="location.reload()" style="background:var(--accent);color:#04222e;border:0;border-radius:9px;padding:10px 22px;font:700 14px Heebo;cursor:pointer">נסה שוב</button>
    </div>`;
  }
})();
</script>
</body></html>
