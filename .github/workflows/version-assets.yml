name: Version browser assets
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '**.css'
      - '**.mjs'
      - '**.js'
      - 'assets/**'
      - 'pipeline/version-assets.py'
      - '.github/workflows/version-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: browser-asset-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate content-addressed browser assets
        run: python pipeline/version-assets.py
      - name: Commit release without changing data or old assets
        run: |
          git config user.name fishing-forecast-bot
          git config user.email fishing-forecast-bot@users.noreply.github.com
          git add index.html static asset-manifest.json release.json
          if ! git diff --cached --quiet; then
            git commit -m "build: version browser assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request Pages build for final release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            if gh api "repos/${{ github.repository }}/pages/builds" -X POST; then exit 0; fi
            sleep 20
          done
          echo '::error::Pages rebuild request failed'
          exit 1
